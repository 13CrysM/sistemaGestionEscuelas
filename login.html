<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gestión Escolar</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap">
</head>

<body>
  <div class="container">
    <div class="login_container">
      <div class="login_title">
        <span>Login</span>
      </div>

      <div class="input_wraper">
        <input type="text" id="user" class="input_field" required>
        <label for="user" class="label">E-mail</label>
        <i class="fa-regular fa-user icon"></i>
      </div>

      <div class="input_wraper">
        <input type="password" id="pass" class="input_field" required>
        <label for="pass" class="label">Contraseña</label>
        <i class="fa-solid fa-lock icon"></i>
      </div>

      <div class="remember-forgot">
        <div class="remember_me">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <div class="forgot">
          <a href="#">Olvidaste la contraseña</a>
        </div>

      </div>

      <div class="input_wraper">
        <a href="dashboard.html">
          <input type="submit" class="input_submit" value="Iniciar Sesión"></a>
      </div>

      <div class="signup">
        <span>No tengo una cuenta <a href="#"> Registrarse</a></span>
      </div>

    </div>
  </div>
</body>
</html>
